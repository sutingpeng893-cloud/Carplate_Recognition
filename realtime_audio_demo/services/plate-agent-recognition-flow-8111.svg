<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="3720" viewBox="0 0 2100 3720" role="img" aria-labelledby="title desc">
<title id="title">车牌识别 Agent 新版流程（Pending Action 两阶段确认）</title>
<desc id="desc">基于 services8111.zip 当前代码绘制。首轮识别与多轮 Pending Action 状态机，标注 LLM 与纯规则/函数节点。</desc>
<defs>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f86"/><stop offset="1" stop-color="#256aa5"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity=".12"/></filter>
  <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1d6fb8"/></marker>
  <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#16875b"/></marker>
  <marker id="ao" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
  <style>
    .page{fill:#fff}.title{font:700 39px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#fff}.sub{font:400 18px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#dbeafe}
    .actor{fill:#f8fbff;stroke:#78a5cd;stroke-width:2.2;rx:18;filter:url(#shadow)}.actor2{fill:#edf7ff;stroke:#3d82bc;stroke-width:2.2;rx:18;filter:url(#shadow)}.at{font:700 25px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#17324a}.life{stroke:#a3b3c0;stroke-width:2;stroke-dasharray:10 10}
    .phase{fill:url(#panel);stroke:#78a8d0;stroke-width:2;rx:22;filter:url(#shadow)}.pill{fill:#1d6fb8;rx:15}.pillO{fill:#c96b0b;rx:15}.pillG{fill:#16875b;rx:15}.pt{font:700 17px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#fff}.ps{font:400 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#526d82}
    .box{fill:#fff;stroke:#8ca8bd;stroke-width:2;rx:14}.blue{fill:#f2f8ff;stroke:#4f8fbd;stroke-width:2;rx:14}.green{fill:#effaf5;stroke:#43a37d;stroke-width:2;rx:14}.orange{fill:#fff8ec;stroke:#dfa349;stroke-width:2;rx:14}.red{fill:#fff4f2;stroke:#dc7b68;stroke-width:2;rx:14}.note{fill:#f8fafc;stroke:#a8bac9;stroke-width:1.8;stroke-dasharray:7 6;rx:14}.term{fill:#eaf8f1;stroke:#218763;stroke-width:2.4;rx:16;filter:url(#shadow)}
    .diamond{fill:#fff7df;stroke:#d59a29;stroke-width:2.2}.bt{font:700 18px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#172f43}.tx{font:400 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#415a6e}.sm{font:400 14px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#52697b}.dt{font:700 16px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#5f450f}.lab{font:700 14px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#465c6e}.lg{font:700 14px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#14704d}.lo{font:700 14px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#a35b08}
    .arr{stroke:#1d6fb8;stroke-width:2.8;fill:none;marker-end:url(#ab)}.arrg{stroke:#16875b;stroke-width:2.8;fill:none;marker-end:url(#ag)}.arro{stroke:#d97706;stroke-width:2.8;fill:none;marker-end:url(#ao)}.dash{stroke:#607789;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#ab)}
  </style>
</defs>
<rect class="page" width="2100" height="3720"/>
<rect x="0" y="0" width="{W}" height="116" fill="url(#head)"/>
<text class="title" x="1050" y="52" text-anchor="middle">车牌识别 Agent 新版流程（Pending Action 两阶段确认）</text>
<text class="sub" x="1050" y="86" text-anchor="middle">基于 services8111.zip 当前代码 · 修改先预执行，用户确认后才写入 car_plate · 多轮每轮最多 2 次 LLM</text>

<rect class="actor" x="90" y="150" width="350" height="94"/><text class="at" x="265" y="205" text-anchor="middle">用户</text>
<rect class="actor2" x="1660" y="150" width="350" height="94"/><text class="at" x="1835" y="205" text-anchor="middle">车牌识别 Agent</text>
<line class="life" x1="265" y1="244" x2="265" y2="3590"/><line class="life" x1="1835" y1="244" x2="1835" y2="3590"/>
<rect class="phase" x="520" y="150" width="1060" height="220"/>
<rect class="pill" x="555" y="172" width="210" height="34"/><text class="pt" x="660" y="195" text-anchor="middle">入口：handle_audio_turn</text>
<rect class="blue" x="760" y="225" width="580" height="105"/>
<text class="bt" x="1050.0" y="255" text-anchor="middle">克隆状态 working</text>
<text class="tx" x="778" y="282">记录 session / turn / audio 日志上下文</text>
<text class="tx" x="778" y="306">每轮从 working.has_car_plate 与 pending_plate 分流</text>
<polygon class="diamond" points="1050,290.0 1230.0,338 1050,386.0 870.0,338"/>
<text class="dt" x="1050" y="328" text-anchor="middle">已有暂存车牌？</text>
<text class="dt" x="1050" y="350" text-anchor="middle">working.has_car_plate</text>
<path class="arr" d="M265,288 L760,288"/>
<text class="lab" x="500" y="276" text-anchor="middle">用户 WAV 音频</text>
<rect class="phase" x="500" y="410" width="1100" height="1040"/>
<rect class="pill" x="535" y="432" width="220" height="34"/><text class="pt" x="645" y="455" text-anchor="middle">首轮识别</text>
<text class="ps" x="780" y="455">working.has_car_plate = False</text>
<rect class="blue" x="720" y="500" width="660" height="112"/>
<text class="bt" x="1050.0" y="530" text-anchor="middle">LLM① detect_plate_presence</text>
<text class="tx" x="738" y="557">判断语音中是否包含车牌信息</text>
<text class="tx" x="738" y="581">max_tokens=8；输出 true / false</text>
<polygon class="diamond" points="1050,629.0 1215.0,675 1050,721.0 885.0,675"/>
<text class="dt" x="1050" y="675" text-anchor="middle">检测到车牌？</text>
<rect class="orange" x="1180" y="755" width="330" height="105"/>
<text class="bt" x="1345.0" y="785" text-anchor="middle">无车牌</text>
<text class="tx" x="1198" y="812">固定话术 NO_PLATE_REPLY</text>
<text class="tx" x="1198" y="836">task_status = need_more_info</text>
<rect class="blue" x="720" y="755" width="660" height="112"/>
<text class="bt" x="1050.0" y="785" text-anchor="middle">LLM② extract_car_plate</text>
<text class="tx" x="738" y="812">从同一段音频提取候选车牌</text>
<text class="tx" x="738" y="836">解析摘要 / JSON，清洗并标准化</text>
<rect class="orange" x="720" y="900" width="660" height="122"/>
<text class="bt" x="1050.0" y="930" text-anchor="middle">条件性 LLM③ 省份重试</text>
<text class="tx" x="738" y="957">仅首字符为 ASCII 字母/数字时调用 normalize_plate_result</text>
<text class="tx" x="738" y="981">否则 0 次；最后规则兜底 G → 冀</text>
<polygon class="diamond" points="1050,1038.0 1245.0,1090 1050,1142.0 855.0,1090"/>
<text class="dt" x="1050" y="1080" text-anchor="middle">长度能否判定车辆类型？</text>
<text class="dt" x="1050" y="1102" text-anchor="middle">7=fuel / 8=new_energy</text>
<rect class="red" x="1180" y="1175" width="330" height="105"/>
<text class="bt" x="1345.0" y="1205" text-anchor="middle">长度非法</text>
<text class="tx" x="1198" y="1232">vehicle_type = unknown</text>
<text class="tx" x="1198" y="1256">返回 invalid_initial_plate</text>
<rect class="green" x="680" y="1175" width="740" height="150"/>
<text class="bt" x="1050.0" y="1205" text-anchor="middle">纯规则状态初始化（0 LLM）</text>
<text class="tx" x="698" y="1232">refresh_plate_state：写入 car_plate / plate_chars</text>
<text class="tx" x="698" y="1256">detect_initial_confusions_by_rule：扫描 甘/赣/津/京/桂/贵/冀/吉、1/E、2/R</text>
<text class="tx" x="698" y="1280">apply_confirmation_actions：生成待确认字符列表</text>
<rect class="box" x="720" y="1350" width="660" height="78"/>
<text class="bt" x="1050.0" y="1380" text-anchor="middle">固定模板回复（0 LLM）</text>
<text class="tx" x="738" y="1407">generate_reply → build_fixed_reply；task_status = need_confirmation</text>
<path class="arr" d="M870,338 L620,338 L620,500 L720,500"/>
<text class="lab" x="640" y="485" text-anchor="middle">否：首轮</text>
<path class="arr" d="M1050,612 L1050,629"/>
<path class="arro" d="M1215,675 L1510,675 L1510,755"/>
<text class="lab" x="1470" y="700" text-anchor="middle">false</text>
<path class="arr" d="M1050,721 L1050,755"/>
<text class="lab" x="1090" y="744" text-anchor="middle">true</text>
<path class="arr" d="M1050,867 L1050,900"/>
<path class="arr" d="M1050,1022 L1050,1038"/>
<path class="arro" d="M1245,1090 L1510,1090 L1510,1175"/>
<text class="lab" x="1470" y="1118" text-anchor="middle">否</text>
<path class="arrg" d="M1050,1142 L1050,1175"/>
<text class="lab" x="1090" y="1164" text-anchor="middle">是</text>
<path class="arr" d="M1050,1325 L1050,1350"/>
<rect class="phase" x="500" y="1490" width="1100" height="340"/>
<rect class="pillO" x="535" y="1512" width="250" height="34"/><text class="pt" x="660" y="1535" text-anchor="middle">多轮入口状态分流</text>
<text class="ps" x="815" y="1535">working.has_car_plate = True</text>
<polygon class="diamond" points="1050,1590.0 1265.0,1645 1050,1700.0 835.0,1645"/>
<text class="dt" x="1050" y="1635" text-anchor="middle">存在待执行修改？</text>
<text class="dt" x="1050" y="1657" text-anchor="middle">working.pending_plate != ""</text>
<rect class="blue" x="610" y="1732" width="350" height="78"/>
<text class="bt" x="785.0" y="1762" text-anchor="middle">分支 A：普通修改轮</text>
<text class="tx" x="628" y="1789">pending_plate 为空；最多 2 次 LLM</text>
<rect class="orange" x="1140" y="1732" width="350" height="78"/>
<text class="bt" x="1315.0" y="1762" text-anchor="middle">分支 B：pending 确认轮</text>
<text class="tx" x="1158" y="1789">pending_plate 非空；1～2 次 LLM</text>
<path class="arr" d="M1230,338 L1540,338 L1540,1645 L1265,1645"/>
<text class="lab" x="1490" y="1618" text-anchor="middle">是：多轮</text>
<path class="arr" d="M835,1645 L785,1645 L785,1732"/>
<text class="lab" x="748" y="1690" text-anchor="middle">否</text>
<path class="arro" d="M1265,1645 L1315,1645 L1315,1732"/>
<text class="lab" x="1350" y="1690" text-anchor="middle">是</text>
<rect class="phase" x="90" y="1875" width="920" height="1380"/>
<rect class="pill" x="125" y="1897" width="250" height="34"/><text class="pt" x="250" y="1920" text-anchor="middle">分支 A：普通修改轮</text>
<rect class="blue" x="220" y="1970" width="660" height="105"/>
<text class="bt" x="550.0" y="2000" text-anchor="middle">LLM① detect_confirmation</text>
<text class="tx" x="238" y="2027">判断用户是否明确确认“当前完整车牌”</text>
<text class="tx" x="238" y="2051">yes / no；max_tokens=8</text>
<polygon class="diamond" points="550,2098.0 725.0,2145 550,2192.0 375.0,2145"/>
<text class="dt" x="550" y="2145" text-anchor="middle">确认整个车牌？</text>
<rect class="term" x="130" y="2230" width="330" height="120"/>
<text class="bt" x="295.0" y="2260" text-anchor="middle">A1：确认成功</text>
<text class="tx" x="148" y="2287">confirm_all；final_car_plate = car_plate</text>
<text class="tx" x="148" y="2311">固定回复 build_confirmed_reply</text>
<text class="tx" x="148" y="2335">task_status = confirmed；本轮仅 1 次 LLM</text>
<rect class="blue" x="520" y="2230" width="400" height="110"/>
<text class="bt" x="720.0" y="2260" text-anchor="middle">LLM② update_car_plate</text>
<text class="tx" x="538" y="2287">从音频提取 replace / insert / delete / none</text>
<text class="tx" x="538" y="2311">后端 apply_plate_edit_commands 预执行，不写入 working.car_plate</text>
<polygon class="diamond" points="720,2368.0 890.0,2415 720,2462.0 550.0,2415"/>
<text class="dt" x="720" y="2415" text-anchor="middle">是否发生有效修改？</text>
<rect class="orange" x="140" y="2505" width="330" height="115"/>
<text class="bt" x="305.0" y="2535" text-anchor="middle">A2-1：修改不清楚</text>
<text class="tx" x="158" y="2562">保持原 car_plate</text>
<text class="tx" x="158" y="2586">EDIT_UNCLEAR_REPLY</text>
<text class="tx" x="158" y="2610">本轮 2 次 LLM</text>
<polygon class="diamond" points="720,2538.0 890.0,2585 720,2632.0 550.0,2585"/>
<text class="dt" x="720" y="2585" text-anchor="middle">新车牌格式合规？</text>
<rect class="red" x="140" y="2690" width="330" height="120"/>
<text class="bt" x="305.0" y="2720" text-anchor="middle">A2-2-1：格式非法</text>
<text class="tx" x="158" y="2747">is_valid_plate_number = False</text>
<text class="tx" x="158" y="2771">保持原 car_plate；build_edit_invalid_reply</text>
<text class="tx" x="158" y="2795">本轮 2 次 LLM</text>
<rect class="green" x="520" y="2690" width="400" height="155"/>
<text class="bt" x="720.0" y="2720" text-anchor="middle">A2-2-2：保存 Pending</text>
<text class="tx" x="538" y="2747">pending_plate = 预执行的新车牌</text>
<text class="tx" x="538" y="2771">pending_commands = 编辑指令</text>
<text class="tx" x="538" y="2795">car_plate 保持原值，尚未真正执行修改</text>
<text class="tx" x="538" y="2819">固定话术：说明修改内容并询问“是否执行？”</text>
<rect class="note" x="220" y="2890" width="660" height="115"/>
<text class="bt" x="550.0" y="2920" text-anchor="middle">关键语义</text>
<text class="tx" x="238" y="2947">LLM 只负责“理解/提取意图”；真正的字符替换、插入、删除由 Python 函数执行</text>
<text class="tx" x="238" y="2971">只有下一轮用户明确同意后，pending_plate 才写入 car_plate</text>
<path class="arr" d="M785,1810 L785,1870 L550,1870 L550,1970"/>
<path class="arr" d="M550,2075 L550,2098"/>
<path class="arrg" d="M375,2145 L295,2145 L295,2230"/>
<text class="lab" x="255" y="2192" text-anchor="middle">是</text>
<path class="arr" d="M725,2145 L720,2145 L720,2230"/>
<text class="lab" x="755" y="2190" text-anchor="middle">否</text>
<path class="arr" d="M720,2340 L720,2368"/>
<path class="arro" d="M550,2415 L305,2415 L305,2505"/>
<text class="lab" x="345" y="2450" text-anchor="middle">否</text>
<path class="arr" d="M720,2462 L720,2538"/>
<text class="lab" x="755" y="2508" text-anchor="middle">是</text>
<path class="arro" d="M550,2585 L305,2585 L305,2690"/>
<text class="lab" x="345" y="2635" text-anchor="middle">否</text>
<path class="arrg" d="M720,2632 L720,2690"/>
<text class="lab" x="755" y="2670" text-anchor="middle">是</text>
<path class="arr" d="M720,2845 L720,2890"/>
<rect class="phase" x="1090" y="1875" width="920" height="1380"/>
<rect class="pillO" x="1125" y="1897" width="285" height="34"/><text class="pt" x="1268" y="1920" text-anchor="middle">分支 B：等待 Pending 确认</text>
<rect class="blue" x="1210" y="1970" width="680" height="108"/>
<text class="bt" x="1550.0" y="2000" text-anchor="middle">LLM① classify_intent（轻量）</text>
<text class="tx" x="1228" y="2027">基于当前 car_plate、pending_plate、上轮“是否执行？”分类</text>
<text class="tx" x="1228" y="2051">输出 execute / reject / unclear；max_tokens=16</text>
<polygon class="diamond" points="1550,2104.0 1760.0,2160 1550,2216.0 1340.0,2160"/>
<text class="dt" x="1550" y="2160" text-anchor="middle">intent 是 execute / reject？</text>
<rect class="green" x="1125" y="2260" width="330" height="132"/>
<text class="bt" x="1290.0" y="2290" text-anchor="middle">B1：execute</text>
<text class="tx" x="1143" y="2317">car_plate ← pending_plate</text>
<text class="tx" x="1143" y="2341">清空 pending_plate / pending_commands</text>
<text class="tx" x="1143" y="2365">规则重扫易混淆位；固定回复“已修改为…”</text>
<text class="tx" x="1143" y="2389">快速路径：本轮 1 次 LLM</text>
<rect class="orange" x="1645" y="2260" width="300" height="132"/>
<text class="bt" x="1795.0" y="2290" text-anchor="middle">B2：reject</text>
<text class="tx" x="1663" y="2317">清空 pending；保留原 car_plate</text>
<text class="tx" x="1663" y="2341">固定回复“保留原车牌…”</text>
<text class="tx" x="1663" y="2365">快速路径：本轮 1 次 LLM</text>
<rect class="blue" x="1210" y="2450" width="680" height="108"/>
<text class="bt" x="1550.0" y="2480" text-anchor="middle">LLM② classify_pending_commands</text>
<text class="tx" x="1228" y="2507">仅第一阶段不是 execute/reject（即 unclear）时触发</text>
<text class="tx" x="1228" y="2531">提取 intent + 新 commands；max_tokens=128</text>
<polygon class="diamond" points="1550,2589.0 1740.0,2640 1550,2691.0 1360.0,2640"/>
<text class="dt" x="1550" y="2640" text-anchor="middle">识别出 new_edit？</text>
<rect class="orange" x="1125" y="2730" width="330" height="118"/>
<text class="bt" x="1290.0" y="2760" text-anchor="middle">B3-0：仍不清楚/拒绝</text>
<text class="tx" x="1143" y="2787">清空旧 pending</text>
<text class="tx" x="1143" y="2811">保留原 car_plate</text>
<text class="tx" x="1143" y="2835">EDIT_UNCLEAR_REPLY 或拒绝处理</text>
<rect class="green" x="1590" y="2730" width="355" height="118"/>
<text class="bt" x="1767.5" y="2760" text-anchor="middle">B3：新修改预执行</text>
<text class="tx" x="1608" y="2787">清空旧 pending</text>
<text class="tx" x="1608" y="2811">apply_plate_edit_commands(原 car_plate, 新 commands)</text>
<text class="tx" x="1608" y="2835">再做格式校验</text>
<polygon class="diamond" points="1765,2878.0 1922.5,2925 1765,2972.0 1607.5,2925"/>
<text class="dt" x="1765" y="2925" text-anchor="middle">新车牌格式合规？</text>
<rect class="red" x="1125" y="3010" width="330" height="115"/>
<text class="bt" x="1290.0" y="3040" text-anchor="middle">B3-1：非法</text>
<text class="tx" x="1143" y="3067">不保存新 pending</text>
<text class="tx" x="1143" y="3091">保留原 car_plate</text>
<text class="tx" x="1143" y="3115">build_edit_invalid_reply</text>
<rect class="green" x="1590" y="3010" width="355" height="125"/>
<text class="bt" x="1767.5" y="3040" text-anchor="middle">B3-2：替换为新 Pending</text>
<text class="tx" x="1608" y="3067">pending_plate = 新预执行车牌</text>
<text class="tx" x="1608" y="3091">pending_commands = 新指令</text>
<text class="tx" x="1608" y="3115">再次询问“是否执行？”；本轮共 2 次 LLM</text>
<rect class="note" x="1210" y="3165" width="680" height="64"/>
<text class="bt" x="1550.0" y="3195" text-anchor="middle">分支 B 调用量</text>
<text class="tx" x="1228" y="3222">直接执行/拒绝：1 次；用户给新修改：最多 2 次。</text>
<path class="arro" d="M1315,1810 L1315,1870 L1550,1870 L1550,1970"/>
<path class="arr" d="M1550,2078 L1550,2104"/>
